<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hasenjagd</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    background-image:url("hintergrund.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* Die vorhandene Titelleiste bleibt ganz oben erhalten. */
header{
    width:100%;
    height:80px;
    background:#1f1f1f;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 3px 8px rgba(0,0,0,.5);
    position:relative;
    z-index:10;
}

header h1{
    color:white;
    font-size:28px;
    font-family:Georgia,serif;
    letter-spacing:1px;
    white-space:nowrap;
    text-align:center;
}

/* Bereich unter der Titelleiste – die Hasentapete bleibt links und rechts sichtbar. */
.startbereich{
    width:100%;
    height:calc(100vh - 80px);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* Das Foto wird als eigenes, zentriertes Quadrat dargestellt. */
.fotorahmen{
    position:relative;
    height:min(calc(100vh - 90px), 100%);
    width:min(calc(100vh - 90px), 100%);
    aspect-ratio:1 / 1;
    flex:0 0 auto;
}

.startbild{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
}

/* Lila START-Button direkt IN das Foto integriert. */
.start{
    position:absolute;
    left:50%;
    bottom:5.5%;
    transform:translateX(-50%);
    width:min(360px,58%);
    height:min(120px,14%);
    min-height:72px;
    border:2px solid rgba(255,255,255,.95);
    border-radius:28px;
    background:linear-gradient(135deg,#6f1dff,#a54cff);
    color:white;
    font-size:clamp(34px,5vw,55px);
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 5px 25px rgba(0,0,0,.65),0 0 18px rgba(165,76,255,.55);
    transition:transform .2s,filter .2s;
    z-index:5;
}

.start:hover{
    transform:translateX(-50%) scale(1.05);
    filter:brightness(1.08);
}

.start:active{
    transform:translateX(-50%) scale(.97);
}

.start:disabled{
    cursor:wait;
    opacity:.85;
}

/* Tablet / Fully Kiosk */
@media (max-height:850px){
    header{height:60px;}
    header h1{font-size:clamp(18px,2.2vw,28px);}
    .startbereich{height:calc(100vh - 60px);}
    .fotorahmen{
        height:min(calc(100vh - 70px),100%);
        width:min(calc(100vh - 70px),100%);
    }
}

@media (max-width:700px){
    header h1{font-size:18px;}
    .start{
        width:62%;
        height:82px;
        min-height:0;
        font-size:38px;
        border-radius:22px;
        bottom:4%;
    }
}
</style>
</head>

<body>

<header>
    <h1>HASENJAGD – AUF DEN SPUREN VON ALBRECHT DÜRER</h1>
</header>

<div class="startbereich">
    <div class="fotorahmen">
        <img class="startbild" src="hase-mit-duerer.png" alt="Albrecht Dürer und der Hase">

        <button class="start" id="startButton" type="button" onclick="startRallye()">
            START
        </button>

        <audio id="audioSeite1" preload="auto">
            <source src="audioseite1.mp3" type="audio/mpeg">
        </audio>
    </div>
</div>

<script>
function startRallye(){
    const audio = document.getElementById('audioSeite1');
    const button = document.getElementById('startButton');

    if(button.disabled) return;

    button.disabled = true;
    button.textContent = '▶ START';

    audio.pause();
    audio.currentTime = 0;

    // Erst wenn das Audio wirklich fertig ist, geht es zur ersten Rallye-Seite.
    audio.onended = function(){
        window.location.href = 'seite2.html';
    };

    audio.onerror = function(){
        button.disabled = false;
        button.textContent = 'START';
        alert('Die Audiodatei „audioseite1.mp3“ konnte nicht geladen werden. Bitte prüfen, ob sie im gleichen Ordner wie diese index.html liegt.');
    };

    const playPromise = audio.play();

    if(playPromise !== undefined){
        playPromise.catch(function(){
            button.disabled = false;
            button.textContent = 'START';
        });
    }
}
</script>

</body>
</html>
