<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seite 18</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{background:url("hintergrund.jpg") center/cover no-repeat;font-family:Arial,sans-serif}header{height:60px;background:#1f1f1f;color:#fff;display:flex;align-items:center;justify-content:center;font:700 28px Georgia,serif;white-space:nowrap}.inhalt{height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.bild{height:58vh;max-width:850px}.bild img{height:100%;width:auto;max-width:90vw;object-fit:contain;display:block;border-radius:12px;box-shadow:0 0 18px rgba(0,0,0,.55)}.zahlen{display:flex;gap:22px}.zahl{width:150px;height:120px;background:#7333a6;color:#fff;border:2px solid #fff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:bold;box-shadow:0 3px 10px rgba(0,0,0,.3)}
@media(max-width:900px){header{font-size:20px;height:55px}.inhalt{height:calc(100vh - 55px);gap:12px}.bild{height:57vh}.zahl{width:120px;height:95px;font-size:46px}.zahlen{gap:14px}}
</style>
<script>
(function(){function start(){const a=new Audio('audioseite17.mp3');a.play().catch(function(){document.addEventListener('pointerdown',()=>a.play().catch(()=>{}),{once:true})})}addEventListener('load',()=>setTimeout(start,150))})();
</script>
</head>
<body>
<header>HASENJAGD – AUF DEN SPUREN VON ALBRECHT DÜRER</header>
<div class="inhalt">
<div class="bild"><img src="hase-mit-duerer.png" alt="Albrecht Dürer mit Hase"></div>
<div class="zahlen"><div class="zahl">1</div><div class="zahl">8</div><div class="zahl">7</div></div>
</div>
</body>
</html>
