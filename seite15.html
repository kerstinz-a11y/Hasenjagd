<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seite 15</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:url("hintergrund.jpg") center/cover no-repeat;
font-family:Arial,sans-serif;

height:100vh;

display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;

overflow:hidden;
}

header{
height:65px;
flex-shrink:0;
width:100%;
background:#000;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-family:Georgia,serif;
font-size:28px;
font-weight:bold;
white-space:nowrap;
}

/* Auswertungsbild */
.bild{
width:92%;
max-width:1100px;

display:flex;
justify-content:center;
align-items:center;

flex:1;
min-height:0;
}

.bild img{
width:100%;
height:auto;

max-height:calc(100vh - 100px);

object-fit:contain;

display:block;

border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.5);
}


/* Zahlencode-Button */
.weiter{
flex-shrink:0;

width:460px;
height:78px;

margin-top:12px;
margin-bottom:18px;

border:none;
border-radius:16px;

background:linear-gradient(#b96dff,#8846ff);

color:black;

font-size:32px;
font-weight:bold;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,.4);

transition:.2s;
}

.weiter:hover{
transform:scale(1.04);
}

.weiter:active{
transform:scale(.98);
}


/* Bei kleineren Bildschirmen */
@media (max-width:1200px){

.bild{
width:94%;
}

.weiter{
width:430px;
height:72px;
font-size:30px;
}

}


@media (max-width:900px){

.bild{
width:97%;
}

.weiter{
width:400px;
height:68px;
font-size:28px;
}

}


/* ===== Sieger-Hase rechts ===== */
.seiger-hase{
    position:absolute;
    right:12%;
    top:120px;
    width:260px;
    z-index:5;
}
.seiger-hase img{
    width:100%;
    height:auto;
    display:block;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.5);
}
@media (max-width:1200px){
    .seiger-hase{width:220px;right:9%;}
}
@media (max-width:900px){
    .seiger-hase{width:180px;right:6%;top:95px;}
}

</style>

<style id="tablet-fit-style">
/* ===== AUTOMATISCHE TABLET-ANPASSUNG FÜR FULLY KIOSK ===== */
html{width:100%;height:100%;overflow:hidden;background-image:url("hintergrund.jpg");background-size:cover;background-position:center;background-repeat:no-repeat;}
body{transform-origin:top left;}
#tabletFitLayer{transform-origin:top left;}
</style>
<script>
(function(){
  function fit(){
    var body=document.body;
    if(!body) return;
    var layer=document.getElementById('tabletFitLayer');
    if(!layer){
      layer=document.createElement('div');
      layer.id='tabletFitLayer';
      while(body.firstChild) layer.appendChild(body.firstChild);
      body.appendChild(layer);
    }
    layer.style.transform='none';
    layer.style.width='100%';
    layer.style.minHeight='0';
    layer.style.height='auto';
    body.style.background='transparent';
    body.style.overflow='hidden';
    var vw=window.innerWidth, vh=window.innerHeight;
    var r=layer.getBoundingClientRect();
    var naturalW=Math.max(layer.scrollWidth,r.width,1);
    var naturalH=Math.max(layer.scrollHeight,r.height,1);
    var scale=Math.min(1,(vw-12)/naturalW,(vh-12)/naturalH);
    if(!isFinite(scale)||scale<=0) scale=1;
    layer.style.transform='scale('+scale+')';
    layer.style.width=(100/scale)+'%';
  }
  window.addEventListener('load',function(){setTimeout(fit,50);setTimeout(fit,300);});
  window.addEventListener('resize',function(){setTimeout(fit,50);});
  window.addEventListener('orientationchange',function(){setTimeout(fit,300);});
  var observer=new MutationObserver(function(){clearTimeout(window.__fitTimer);window.__fitTimer=setTimeout(fit,80);});
  window.addEventListener('load',function(){observer.observe(document.body,{childList:true,subtree:true});});
})();
</script>

</head>

<body>

<header>HASENJAGD – AUF DEN SPUREN VON ALBRECHT DÜRER</header>

<div class="bild">

<img src="seite15.png" alt="Auswertung">

</div>

<div class="seiger-hase">
<img src="hase-sieger.png" alt="Sieger-Hase">
</div>


<button class="weiter" onclick="weiter()">

Zum Zahlencode &#10140;

</button>


<script>

function weiter(){

window.location.href="seite16.html";

}

</script>

</body>
</html>
